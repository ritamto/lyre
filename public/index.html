<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1eee4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='5' width='34' height='30' fill='%23f8f6ef' stroke='%23292920' stroke-width='2'/%3E%3Cpath d='M9 13h22M9 19h22M9 25h14' stroke='%23292920' stroke-width='2'/%3E%3C/svg%3E">
<title>Guestbook</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f1eee4;
    --ink: #292920;
    --muted: #77766b;
    --rule: #c9c6b9;
    --panel: #f8f6ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 16px;
    background: var(--paper); color: var(--ink);
    font: 15px/1.55 "Courier New", monospace;
  }
  main {
    width: min(100%, 620px); margin: 0 auto; padding: 28px;
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: 4px 4px 0 rgba(41, 41, 32, .12);
  }
  header { padding-bottom: 18px; border-bottom: 1px dashed var(--rule); }
  .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 12px; letter-spacing: .12em; }
  h1 { margin: 0; font-size: clamp(25px, 7vw, 34px); line-height: 1.15; }
  header p { margin: 9px 0 0; color: var(--muted); }
  form { display: grid; gap: 12px; padding: 20px 0; border-bottom: 1px dashed var(--rule); }
  label { display: grid; gap: 5px; font-size: 13px; }
  input, textarea, button { font: inherit; }
  input, textarea {
    width: 100%; padding: 10px 11px; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 0;
  }
  textarea { min-height: 92px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button {
    justify-self: start; padding: 9px 14px; color: var(--panel); background: var(--ink);
    border: 1px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #444439; }
  button:disabled { opacity: .6; cursor: wait; }
  #status { min-height: 1.5em; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  #status.error { color: var(--ink); font-weight: 700; }
  h2 { margin: 20px 0 8px; font-size: 15px; }
  .entries { margin: 0; padding: 0; list-style: none; }
  .entry { padding: 14px 0; border-top: 1px dashed var(--rule); }
  .entry-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
  .entry-head strong { overflow-wrap: anywhere; color: var(--ink); font-size: 14px; }
  .entry p { margin: 7px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .empty { color: var(--muted); }
  @media (max-width: 480px) {
    body { padding: 16px 10px; }
    main { padding: 20px 16px; }
    .entry-head { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">A LITTLE NOTEBOOK ON THE INTERNET</p>
    <h1>Guestbook</h1>
    <p>Leave a note for whoever stops by.</p>
  </header>

  <form id="form" autocomplete="on">
    <label for="name">Name <span>(optional)</span>
      <input id="name" name="name" type="text" maxlength="24" placeholder="Your name">
    </label>
    <label for="message">Message
      <textarea id="message" name="message" maxlength="500" placeholder="Write a little note…" required></textarea>
    </label>
    <button id="submit" type="submit">Sign the guestbook</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <section aria-labelledby="entries-title">
    <h2 id="entries-title">Recent notes</h2>
    <ol id="entries" class="entries"></ol>
  </section>
</main>

<script>
(() => {
  const form = document.getElementById("form");
  const entries = document.getElementById("entries");
  const status = document.getElementById("status");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");
  let notes = [];

  async function api(path, options) {
    const response = await fetch(path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    const data = await response.json().catch(() => null);
    if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
    return data;
  }

  function formatDate(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function renderNotes() {
    if (!notes.length) {
      const empty = document.createElement("li");
      empty.className = "entry empty";
      empty.textContent = "No notes yet. Be the first to sign.";
      entries.replaceChildren(empty);
      return;
    }

    entries.replaceChildren(...notes.slice(0, 30).map((note) => {
      const item = document.createElement("li");
      item.className = "entry";
      const head = document.createElement("div");
      head.className = "entry-head";
      const name = document.createElement("strong");
      name.textContent = note.name || "Anonymous";
      const date = document.createElement("time");
      date.dateTime = note.created_at || "";
      date.textContent = formatDate(note.created_at);
      const text = document.createElement("p");
      text.textContent = note.message;
      head.append(name, date);
      item.append(head, text);
      return item;
    }));
  }

  function setStatus(text, error = false) {
    status.textContent = text;
    status.classList.toggle("error", error);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = message.value.trim();
    if (!text) return;

    submit.disabled = true;
    submit.textContent = "Saving…";
    setStatus("");
    try {
      const note = await api("/api/stars", {
        method: "POST",
        body: JSON.stringify({
          name: form.elements.name.value.trim(),
          message: text,
          hue: 0,
        }),
      });
      notes = [note, ...notes];
      renderNotes();
      message.value = "";
      setStatus("Your note has been added.");
    } catch (error) {
      setStatus(error.message, true);
    } finally {
      submit.disabled = false;
      submit.textContent = "Sign the guestbook";
    }
  });

  api("/api/stars")
    .then((items) => {
      if (!Array.isArray(items)) throw new Error("Could not load notes.");
      notes = items;
      renderNotes();
    })
    .catch((error) => setStatus(error.message, true));
})();
</script>
</body>
</html>
